<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Taxpro Consultancy Services</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Taxpro Consultancy Services</h1>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="about.html">About Us</a> | 
            <a href="services.html">Services</a> | 
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Contact Us</h2>
        <p>Fill out the form below to get in touch with our team.</p>

        <form action="https://formspree.io/f/https://formspree.io/f/mjykjbpo" method="POST">
            <div>
                <label for="name">Your Name:</label><br>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>
            <br>
            <div>
                <label for="email">Your Email:</label><br>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>
            <br>
            <div>
                <label for="message">Your Message:</label><br>
                <textarea id="message" name="message" rows="5" placeholder="How can we assist you?" required></textarea>
            </div>
            <br>
            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Taxpro Consultancy Services. All rights reserved.</p>
    </footer>
</body>
</html>
